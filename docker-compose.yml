services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-reservas_db}
      POSTGRES_USER: ${DB_USER:-reservas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_SSLMODE: disable
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
