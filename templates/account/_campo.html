<div class="mb-3">
  <label class="form-label" for="{{ campo.id_for_label }}">{{ etiqueta|default:campo.label }}</label>
  {{ campo }}
  {% if ayuda %}<div class="form-text">{{ ayuda }}</div>{% endif %}
  {% for e in campo.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
</div>
